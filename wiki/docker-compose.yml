# MeshCape wiki — Wiki.js 3 + PostgreSQL 18 + Cloudflare Tunnel
#
# Usage (on the wiki VM):
#   cp .env.example .env    # then fill in the values
#   docker compose up -d
#
# Nothing is published on the host's network ports: the wiki is reached
# only through the Cloudflare Tunnel (wiki.meshcape.io). For first-time
# setup on your LAN before the tunnel is live, add the LAN override:
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d db wiki
# and browse to http://<vm-ip>:3080.
#
# Built to share a VM with other services:
# - Everything is namespaced under the project name "meshcape-wiki"
#   (containers, network and volume), so nothing clashes with other stacks.
# - Memory and CPU are capped so the wiki can never starve its neighbours.
# - Postgres is NOT published on the host, so an existing Postgres is unaffected.

name: meshcape-wiki

services:
  db:
    image: postgres:18-alpine   # Wiki.js 3 supports PostgreSQL 17 and 18 only
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 images keep data under /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  wiki:
    image: ghcr.io/requarks/wiki:3   # follows the latest 3.x release; never use :latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: wiki
      # Root admin account, created on first start only (no effect afterwards).
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env}
    mem_limit: 1536m   # Wiki.js 3 needs at least 1 GB
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - wiki
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # set in .env once the tunnel exists (Part 4)
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
