# MeshCape wiki — Wiki.js + PostgreSQL + Cloudflare Tunnel
#
# Usage (on the wiki VM):
#   cp .env.example .env    # then fill in the values
#   docker compose up -d
#
# Nothing is published on the host's network ports: the wiki is reached
# only through the Cloudflare Tunnel (wiki.meshcape.io). For first-time
# setup on your LAN before the tunnel is live, uncomment the `ports`
# block under `wiki` and browse to http://<vm-ip>:3000.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  wiki:
    image: ghcr.io/requarks/wiki:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: wiki
    # ports:
    #   - "3000:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - wiki
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-data:
